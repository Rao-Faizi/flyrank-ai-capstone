<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Settings</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <div class="glass-panel">
            <header class="panel-header">
                <h1>User Settings</h1>
                <p>Manage your account preferences and AI configuration.</p>
            </header>

            <form id="settings-form" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="johndoe" required minlength="3">
                    <div class="error-message" id="username-error">Username must be at least 3 characters.</div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                    <div class="error-message" id="email-error">Please enter a valid email address.</div>
                </div>

                <div class="form-group">
                    <label for="apikey">OpenAI API Key</label>
                    <input type="password" id="apikey" name="apikey" placeholder="sk-..." required pattern="^sk-[a-zA-Z0-9]{32,}$">
                    <div class="error-message" id="apikey-error">Please enter a valid API key starting with 'sk-'.</div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">
                        <span class="btn-text">Save Settings</span>
                        <div class="loader" id="submit-loader"></div>
                    </button>
                </div>
            </form>
            
            <div id="toast" class="toast">
                <span class="toast-icon">✓</span>
                <span class="toast-message">Settings saved successfully!</span>
            </div>
        </div>
    </main>

    <script src="dist/settings.js"></script>
</body>
</html>
